<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration Form</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-r from-gray-400 via-gray-600 to-blue-800 px-2">
  <div class="flex flex-col lg:flex-row gap-6 px-4">
    
    <!-- Registration Form -->
    <div class="w-full max-w-md bg-white p-6 rounded-lg shadow-lg">
      <h1 class="text-2xl font-bold text-center mb-6">Bio-data Form</h1>
      <p  class="text-2xl font-bold text-center mb-6">New users sign-up here</p>
      <form id="registerForm" class="space-y-4">
        <div class="flex flex-col" id="fullname">
          <label class="mb-1 font-medium">Fullname:</label>
          <input type="text" name="fullname" placeholder="Fullname" class="border rounded px-3 py-2" />
        </div>

        <div class="flex flex-col" id="email">
          <label class="mb-1 font-medium">Email:</label>
          <input type="email" name="email" class="border rounded px-3 py-2" />
        </div>

        <div class="flex flex-col" id="password">
          <label class="mb-1 font-medium">Password:</label>
          <input type="password" name="password" class="border rounded px-3 py-2" />
          <button id="showPass" type="button" class="text-sm text-blue-600 mt-1 self-end">Show Password</button>
        </div>

        <div class="flex flex-col" id="dob">
          <label class="mb-1 font-medium">Date of Birth:</label>
          <input type="date" name="dob" class="border rounded px-3 py-2" />
        </div>

        <div class="text-center">
          <input type="submit" id="submit" value="Submit" class="bg-blue-700 text-white px-4 py-2 rounded hover:bg-blue-800 cursor-pointer" />
        </div>
      </form>
      <div id="result" class="text-black mt-4 text-sm"></div>
    </div>

    <!-- Login Form -->
    <div class="w-full max-w-md  bg-white p-6 rounded-lg shadow-lg">
      <h2 class="text-2xl font-bold text-center mb-6">Login</h2>
      <p class="text-2xl font-bold text-center mb-6">Current account holders</p>
      <form action="login form" class="space-y-4">
        <div class="flex flex-col">
          <label class="mb-1 font-medium">Email:</label>
          <input type="email" name="email" class="border rounded px-3 py-2" />
        </div>

        <div class="flex flex-col">
          <label class="mb-1 font-medium">Password:</label>
          <input type="password" name="password" class="border rounded px-3 py-2" />
        </div>
      </form>

      <div class="text-center mt-4">
        <button id="loginButton" type="button" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Login</button>
      </div>
      <div id="loginResult" class="text-sm text-center mt-4 text-black"></div>
    </div>
  </div>

  <script>
    const btn = document.querySelector('#submit');
    const form = document.querySelector('#registerForm');
    const loginEmail = document.querySelector('form[action="login form"] input[name="email"]');

    btn.addEventListener('click', (e) => {
      e.preventDefault();

      document.querySelectorAll('span').forEach(span => span.remove());
      document.getElementById('result').innerHTML = '';

      let isValid = true;
      const fullname = form.fullname.value.trim();
      const email = form.email.value.trim();
      const password = form.password.value;
      const dob = form.dob.value;

      if (!fullname) {
        isValid = false;
        let span = document.createElement('span');
        span.style.color = '#ff0000';
        span.innerText = 'Your name cannot be empty';
        document.getElementById('fullname').appendChild(span);
      }

      if (!email) {
        isValid = false;
        let span = document.createElement('span');
        span.style.color = '#ff0000';
        span.innerText = 'Your email cannot be empty';
        document.getElementById('email').appendChild(span);
      }

      if (!password) {
        isValid = false;
        let span = document.createElement('span');
        span.style.color = '#ff0000';
        span.innerText = 'Your password cannot be empty';
        document.getElementById('password').appendChild(span);
      } else {
        const passwordPattern = /^(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}$/;
        if (!passwordPattern.test(password)) {
          isValid = false;
          let span = document.createElement('span');
          span.style.color = '#ff0000';
          span.innerText = 'Password must be at least 8 characters long and include at least one number, one lowercase letter, and one uppercase letter.';
          document.getElementById('password').appendChild(span);
        }
      }

      if (!dob) {
        isValid = false;
        let span = document.createElement('span');
        span.style.color = '#ff0000';
        span.innerText = 'Date of Birth cannot be empty';
        document.getElementById('dob').appendChild(span);
      } else {
        const dobDate = new Date(dob);
        const today = new Date();
        let age = today.getFullYear() - dobDate.getFullYear();
        const monthDiff = today.getMonth() - dobDate.getMonth();
        if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < dobDate.getDate())) {
          age--;
        }
        if (age < 18) {
          isValid = false;
          let span = document.createElement('span');
          span.style.color = '#ff0000';
          span.innerText = 'You must be at least 18 years old to register.';
          document.getElementById('dob').appendChild(span);
        }
      }

      if (isValid) {
        localStorage.setItem('fullname', fullname);
        localStorage.setItem('email', email);
        localStorage.setItem('password', password);
        localStorage.setItem('dob', dob);

        document.getElementById('result').innerHTML = `
          <h2 class="text-lg font-bold mb-2">Registration Successful</h2>
          <ul class="list-disc pl-5 space-y-1">
            <li><strong>Name:</strong> ${fullname}</li>
            <li><strong>Email:</strong> ${email}</li>
            <li><strong>Password:</strong> ${password}</li>
            <li><strong>Date of Birth:</strong> ${dob}</li>
          </ul>
        `;

        form.reset();
      } else {
        document.getElementById('result').innerHTML = `<span style="color:#ff0000">Please fill all fields correctly</span>`;
      }
    });

    document.querySelector("#showPass").addEventListener('click', () => {
      const passwordInput = form.password;
      const showPass = document.querySelector("#showPass");
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        showPass.innerText = "Hide Password";
      } else {
        passwordInput.type = "password";
        showPass.innerText = "Show Password";
      }
    });

    const loginButton = document.getElementById("loginButton");
    const loginResult = document.getElementById("loginResult");

    loginButton.addEventListener("click", () => {
      const storedEmail = localStorage.getItem('email');
      const storedPassword = localStorage.getItem('password');
      const enteredEmail = loginEmail.value.trim();
      const enteredPassword = document.querySelector('form[action="login form"] input[name="password"]').value;

      if (enteredEmail === storedEmail && enteredPassword === storedPassword) {
        loginResult.innerHTML = `<span style="color:limegreen">Login successful. Welcome!</span>`;
      } else {
        loginResult.innerHTML = `<span style="color:#ff0000">Login failed. Email or Password is incorrect.</span>`;
      }
    });
  </script>
</body>
</html>
